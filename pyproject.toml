[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "china-auto-market-analysis"
version = "0.1.0"
description = "Reproducible data and analysis components for the China auto market project"
readme = "README_EN.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.12",
  "jieba>=0.42",
  "lxml>=4.9",
  "matplotlib>=3.7",
  "nbformat>=5.9",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "requests>=2.28",
  "scikit-learn>=1.3",
  "shap>=0.46",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.12",
]
notebook = [
  "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly isolated external service",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E402"]
